name: Weekly Reminder

on:
  schedule:
    # Every 30 minutes on Sundays, 12:00–19:59 UTC. This covers the 13:00–20:00
    # UK window in both GMT and BST. The endpoint skips runs outside the window
    # and sends to each device once, so late or dropped runs are covered by the
    # next one. Minutes avoid the top of the hour, when GitHub delays runs most.
    - cron: "23,53 12-19 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: "Send now to every device, ignoring the window"
        type: boolean
        required: false
        default: false

concurrency:
  group: weekly-reminder
  cancel-in-progress: false

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Send weekly push reminders
        run: |
          curl --fail-with-body --silent --show-error -X POST "${{ vars.CF_PAGES_URL }}/api/push/send" \
            -H "Authorization: Bearer ${{ secrets.SEND_SECRET }}" \
            -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"force": ${{ inputs.force == true }}}'
