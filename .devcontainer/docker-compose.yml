version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces/family-todo:cached
      - pnpm-store:/home/node/.local/share/pnpm/store
    environment:
      - NODE_ENV=development
    ports:
      - "5173:5173"
      - "4173:4173"
      - "54321:54321"
      - "54322:54322"
      - "54323:54323"
    command: sleep infinity
    networks:
      - family-todo-dev

volumes:
  pnpm-store:

networks:
  family-todo-dev:
    driver: bridge
